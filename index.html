<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Personal portfolio and research profile.">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{--ink:#172033;--muted:#697386;--line:#e7eaf1;--paper:#fff;--bg:#f7f8fc;--blue:#4d65e8;--shadow:0 18px 55px rgba(27,39,75,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans KR",sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 44px));margin:auto}
    header{position:sticky;top:0;z-index:10;background:rgba(247,248,252,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(231,234,241,.8)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.7px;font-size:18px}.brand span{color:var(--blue)}.links{display:flex;gap:27px;color:#596276;font-size:13px;font-weight:700}.links a:hover,.links a.active{color:var(--blue)}.links a{padding:8px 0}.menu{display:none;border:0;background:none;font-size:23px}
    .hero{padding:86px 0 70px;display:grid;grid-template-columns:1.35fr .65fr;gap:55px;align-items:center}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,66px);letter-spacing:-3px;line-height:1.13;margin:20px 0}.hero h1 em{font-style:normal;color:var(--blue)}.lead{font-size:17px;color:var(--muted);max-width:610px}.actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}.btn{padding:12px 19px;border-radius:10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px #4d65e83a}.secondary{background:#fff;border:1px solid var(--line)}
    .profile{background:linear-gradient(145deg,#e8ebff,#f8f9ff);border:1px solid #e2e6ff;border-radius:26px;padding:28px;box-shadow:var(--shadow)}.avatar{width:92px;height:92px;border-radius:24px;background:linear-gradient(145deg,#6278f2,#9ba8ff);display:grid;place-items:center;color:white;font-size:31px;font-weight:800}.profile h3{font-size:20px;margin:18px 0 2px}.profile p{margin:0;color:var(--muted);font-size:13px}.profile .meta{margin-top:24px;padding-top:18px;border-top:1px solid #dfe3f5;display:grid;gap:10px;font-size:12px;color:#596276}
    section{padding:54px 0;scroll-margin-top:75px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.kicker{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:1.5px}.section-head h2{font-size:29px;letter-spacing:-1px;margin:4px 0 0}.section-head p{margin:0;color:var(--muted);font-size:13px}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.timeline-item,.project{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 5px 20px #1c2a4a05}.panel h3{margin:0 0 10px;font-size:16px}.panel p,.panel li{color:var(--muted);font-size:14px}.panel p{margin:0}.panel ul{padding-left:20px;margin:12px 0 0}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.tag{background:#f1f3fa;color:#596276;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700}
    .timeline,.cards{display:grid;gap:13px}.timeline-item{display:grid;grid-template-columns:145px 1fr;gap:20px;padding:20px 23px}.date{color:var(--blue);font-size:12px;font-weight:800}.timeline-item h3,.project h3{font-size:15px;margin:0}.timeline-item p,.project p{font-size:13px;color:var(--muted);margin:5px 0 0}.cards{grid-template-columns:repeat(2,1fr);gap:17px}.project{padding:22px;transition:.2s}.project:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.project .tags{margin-top:14px}.contact{background:#18213a;color:#fff;border-radius:23px;padding:34px;display:flex;justify-content:space-between;align-items:center;gap:20px}.contact h2{font-size:25px;margin:0 0 5px}.contact p{color:#b8c0d3;margin:0;font-size:13px}.contact .btn{background:#fff;color:#18213a;white-space:nowrap}.notice{font-size:11px;color:#939aaa;margin-top:15px}footer{padding:30px 0 42px;color:#9299a8;font-size:11px;display:flex;justify-content:space-between;gap:15px}
    .markdown{padding:70px 0 90px;max-width:900px}.markdown h1{font-size:clamp(38px,6vw,62px);letter-spacing:-2px;line-height:1.2;margin:0 0 20px;color:var(--ink)}.markdown h2{font-size:28px;letter-spacing:-.8px;margin:58px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}.markdown h3{font-size:19px;margin:30px 0 10px}.markdown p,.markdown li{color:#596276;font-size:15px;line-height:1.9}.markdown blockquote{margin:24px 0;padding:14px 20px;border-left:3px solid var(--blue);background:#eef0ff;border-radius:0 10px 10px 0;color:#596276}.markdown ul{padding-left:23px}.markdown a{color:var(--blue);text-decoration:underline}.markdown strong{color:var(--ink)}.markdown hr{border:0;border-top:1px solid var(--line);margin:38px 0}.markdown code{background:#eef0f5;padding:2px 6px;border-radius:5px}.markdown img{display:block;max-width:min(100%,720px);height:auto;margin:22px auto;border-radius:18px;box-shadow:0 12px 35px rgba(27,39,75,.12)}.markdown .profile-photo img{width:min(260px,65vw);max-height:360px;aspect-ratio:4/5;object-fit:cover;margin:8px 0 26px;border-radius:22px}.markdown.loading{text-align:center;color:var(--muted);padding:100px 0}.markdown.error{color:#b42318}
    .loading{padding:100px 0;text-align:center;color:var(--muted)}.error{color:#b42318}
    @media(max-width:760px){.links{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;padding:18px 24px;flex-direction:column;gap:13px;border-bottom:1px solid var(--line)}.links.open{display:flex}.menu{display:block}.hero{grid-template-columns:1fr;padding:58px 0 35px;gap:30px}.about-grid,.cards{grid-template-columns:1fr}.timeline-item{grid-template-columns:1fr;gap:4px}.section-head{display:block}.section-head p{margin-top:8px}.contact{align-items:flex-start;flex-direction:column}footer{flex-direction:column}}

    .page-content[hidden]{display:none}.page-content{min-height:65vh}.page-content>.markdown{padding-top:54px}.page-content h2:first-child{margin-top:20px}.links a.active{position:relative}.links a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--blue);border-radius:2px}\n    .profile-intro{display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto auto;column-gap:18px;row-gap:8px;align-items:start;margin:18px 0 42px;padding:26px;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow)}
    .profile-intro .profile-photo{grid-column:1;grid-row:1;margin:0}.profile-intro .profile-photo img{display:block;width:220px;max-width:220px;height:auto;max-height:none;aspect-ratio:auto;object-fit:contain;object-position:center;margin:0;border-radius:3px;box-shadow:none}.profile-summary{grid-column:2;grid-row:1}.profile-summary h2{margin:0 0 8px;font-size:1.55rem}.profile-summary p{margin:0;color:var(--muted)}.profile-links{grid-column:1;grid-row:2;display:flex;flex-direction:column;flex-wrap:wrap;gap:7px;align-items:flex-start}.profile-links a{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;font-weight:500;color:#697386;background:#fff}.profile-links a:hover{background:#f1f3ff;border-color:#cbd2ff;color:#596276}.profile-links .email-icon{display:inline-flex;align-items:center;margin-right:6px;color:currentColor}.profile-links .email-icon svg{display:block}
    @media(max-width:760px){.profile-intro{grid-template-columns:220px minmax(0,1fr);column-gap:12px;row-gap:10px;padding:16px;margin:12px 0 32px}.profile-intro .profile-photo img{width:220px;max-width:220px;max-height:none;aspect-ratio:auto;object-fit:contain}.profile-summary h2{font-size:1.2rem}.profile-summary p{font-size:.9rem}.profile-links{gap:6px}.profile-links a{font-size:.72rem;padding:5px 7px}}
    @media(max-width:420px){.profile-intro{grid-template-columns:220px minmax(0,1fr);column-gap:12px}.profile-intro .profile-photo img{width:220px;max-width:220px}.profile-links{flex-direction:row;align-items:flex-start}.profile-links a{white-space:nowrap}}
  </style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="#home" id="brand-home">MW<span>.</span></a><nav class="links" id="navlinks" aria-label="Main navigation"><a href="#home" data-page="home" class="active">Home</a><a href="#publication" data-page="publication">Publication</a><a href="#photos" data-page="photos">Photos</a><a href="#etc" data-page="etc">Etc</a></nav><button class="menu" id="menu" aria-label="메뉴 열기">☰</button></div></header>
<main class="wrap"><article id="content" class="markdown loading">내용을 불러오는 중입니다…</article></main>
<footer class="wrap"><span>© <span id="year"></span> <span id="footer-name">Portfolio</span></span><span>이 홈페이지의 내용은 content.md에서 수정할 수 있습니다.</span></footer>
<script>
const $=(s,root=document)=>root.querySelector(s);
const sectionPage={
  'About':'home','Education':'home','Research Experience':'home','Leadership':'home',
  'Publications':'publication','Presentations':'publication','Photos':'photos',
  'Projects':'etc','Files':'etc','Contact':'etc'
};
function showPage(page,updateHash=true){
  document.querySelectorAll('.page-content').forEach(el=>el.hidden=el.dataset.page!==page);
  document.querySelectorAll('#navlinks a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  if(updateHash) history.replaceState(null,'','#'+page);
  $('#navlinks').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}
async function loadContent(){
 try{
  const response=await fetch('./content.md?v='+Date.now());
  if(!response.ok)throw new Error('content.md 파일을 불러오지 못했습니다.');
  const markdown=await response.text();
  const main=$('#content');
  main.innerHTML=marked.parse(markdown);
  main.classList.remove('loading');
  const photo=main.querySelector('.profile-photo');
  const heading=main.querySelector('h1');
  const summary=main.querySelector('.profile-summary');
  if(photo && summary){
    const params=new URLSearchParams(location.search);
    const links=[
      ['Email',params.get('email')||'mailto:wmw0602@korea.ac.kr'],
      ['GitHub',params.get('github')||'https://github.com/mwwang62'],
      ['Google Scholar',params.get('scholar')],
      ['LinkedIn',params.get('linkedin')],
      ['CV',params.get('cv')]
    ].filter(([,url])=>url && url.trim());
    const intro=document.createElement('section');
    intro.className='profile-intro';
    // Keep only the name and the profile-summary paragraph beside the portrait.
    const nav=document.createElement('nav');
    nav.className='profile-links';
    nav.setAttribute('aria-label','Profile links');
    links.forEach(([label,url])=>{
      const a=document.createElement('a');a.href=url;
      if(label==='Email' || label==='GitHub'){
        const icon=document.createElement('span');icon.className='email-icon';icon.setAttribute('aria-hidden','true');
        icon.innerHTML=label==='Email'
          ? '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="3" width="13" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="m2.5 4 5.5 4.5L13.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : '<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M8 .8a7.2 7.2 0 0 0-2.28 14.03c.36.07.49-.16.49-.35v-1.25c-2 .44-2.42-.85-2.42-.85-.33-.83-.8-1.05-.8-1.05-.65-.45.05-.44.05-.44.72.05 1.1.74 1.1.74.64 1.1 1.68.78 2.09.6.06-.47.25-.78.46-.96-1.6-.18-3.28-.8-3.28-3.56 0-.79.28-1.43.74-1.94-.08-.18-.32-.92.07-1.91 0 0 .6-.19 1.98.74a6.9 6.9 0 0 1 3.6 0c1.38-.93 1.98-.74 1.98-.74.39.99.15 1.73.07 1.91.46.51.74 1.15.74 1.94 0 2.77-1.68 3.38-3.29 3.56.26.22.49.66.49 1.33v1.97c0 .19.13.42.5.35A7.2 7.2 0 0 0 8 .8Z"/></svg>';
        a.append(icon,document.createTextNode(label));
      }else{a.textContent=label;}
      if(!url.startsWith('mailto:')){a.target='_blank';a.rel='noopener noreferrer'}
      nav.appendChild(a);
    });
    photo.parentNode.insertBefore(intro,photo);
    intro.append(photo,summary,nav);
  }
  const title=main.querySelector('h1');
  const name=title?title.textContent.trim():'Portfolio';
  document.title=name+' | Portfolio';
  $('#footer-name').textContent=name;
  const pages={home:document.createElement('section'),publication:document.createElement('section'),photos:document.createElement('section'),etc:document.createElement('section')};
  Object.entries(pages).forEach(([key,el])=>{el.className='page-content';el.dataset.page=key;el.hidden=key!=='home';});
  let current='home';
  [...main.childNodes].forEach(node=>{
    if(node.nodeType===1 && node.tagName==='H2'){
      const headingText=node.textContent.trim();
      current=sectionPage[headingText]||'etc';
    }
    pages[current].appendChild(node);
  });
  main.replaceWith(...Object.values(pages));
  const initial=location.hash.replace('#','');
  showPage(pages[initial]?initial:'home',false);
 }catch(error){
  const main=$('#content');main.classList.add('loading','error');
  main.textContent=error.message;
 }
}
$('#year').textContent=new Date().getFullYear();
$('#menu').addEventListener('click',()=>$('#navlinks').classList.toggle('open'));
$('#navlinks').addEventListener('click',event=>{
  const link=event.target.closest('a[data-page]');
  if(link){event.preventDefault();showPage(link.dataset.page);}
});
$('#brand-home').addEventListener('click',event=>{event.preventDefault();showPage('home');});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(['home','publication','photos','etc'].includes(page))showPage(page,false);});
loadContent();
</script>
</body></html>
