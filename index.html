<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="Personal portfolio and research profile.">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{--ink:#172033;--muted:#697386;--line:#e7eaf1;--paper:#fff;--bg:#f7f8fc;--blue:#4d65e8;--shadow:0 18px 55px rgba(27,39,75,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","Noto Sans KR",sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 44px));margin:auto}
    header{position:sticky;top:0;z-index:10;background:rgba(247,248,252,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(231,234,241,.8)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.7px;font-size:18px}.brand span{color:var(--blue)}.links{display:flex;gap:27px;color:#596276;font-size:13px;font-weight:700}.links a:hover{color:var(--blue)}.menu{display:none;border:0;background:none;font-size:23px}
    .hero{padding:86px 0 70px;display:grid;grid-template-columns:1.35fr .65fr;gap:55px;align-items:center}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,66px);letter-spacing:-3px;line-height:1.13;margin:20px 0}.hero h1 em{font-style:normal;color:var(--blue)}.lead{font-size:17px;color:var(--muted);max-width:610px}.actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}.btn{padding:12px 19px;border-radius:10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px #4d65e83a}.secondary{background:#fff;border:1px solid var(--line)}
    .profile{background:linear-gradient(145deg,#e8ebff,#f8f9ff);border:1px solid #e2e6ff;border-radius:26px;padding:28px;box-shadow:var(--shadow)}.avatar{width:92px;height:92px;border-radius:24px;background:linear-gradient(145deg,#6278f2,#9ba8ff);display:grid;place-items:center;color:white;font-size:31px;font-weight:800}.profile h3{font-size:20px;margin:18px 0 2px}.profile p{margin:0;color:var(--muted);font-size:13px}.profile .meta{margin-top:24px;padding-top:18px;border-top:1px solid #dfe3f5;display:grid;gap:10px;font-size:12px;color:#596276}
    section{padding:54px 0;scroll-margin-top:75px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.kicker{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:1.5px}.section-head h2{font-size:29px;letter-spacing:-1px;margin:4px 0 0}.section-head p{margin:0;color:var(--muted);font-size:13px}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.timeline-item,.project{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 5px 20px #1c2a4a05}.panel h3{margin:0 0 10px;font-size:16px}.panel p,.panel li{color:var(--muted);font-size:14px}.panel p{margin:0}.panel ul{padding-left:20px;margin:12px 0 0}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.tag{background:#f1f3fa;color:#596276;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700}
    .timeline,.cards{display:grid;gap:13px}.timeline-item{display:grid;grid-template-columns:145px 1fr;gap:20px;padding:20px 23px}.date{color:var(--blue);font-size:12px;font-weight:800}.timeline-item h3,.project h3{font-size:15px;margin:0}.timeline-item p,.project p{font-size:13px;color:var(--muted);margin:5px 0 0}.cards{grid-template-columns:repeat(2,1fr);gap:17px}.project{padding:22px;transition:.2s}.project:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.project .tags{margin-top:14px}.contact{background:#18213a;color:#fff;border-radius:23px;padding:34px;display:flex;justify-content:space-between;align-items:center;gap:20px}.contact h2{font-size:25px;margin:0 0 5px}.contact p{color:#b8c0d3;margin:0;font-size:13px}.contact .btn{background:#fff;color:#18213a;white-space:nowrap}.notice{font-size:11px;color:#939aaa;margin-top:15px}footer{padding:30px 0 42px;color:#9299a8;font-size:11px;display:flex;justify-content:space-between;gap:15px}
    .loading{padding:100px 0;text-align:center;color:var(--muted)}.error{color:#b42318}
    @media(max-width:760px){.links{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;padding:18px 24px;flex-direction:column;gap:13px;border-bottom:1px solid var(--line)}.links.open{display:flex}.menu{display:block}.hero{grid-template-columns:1fr;padding:58px 0 35px;gap:30px}.about-grid,.cards{grid-template-columns:1fr}.timeline-item{grid-template-columns:1fr;gap:4px}.section-head{display:block}.section-head p{margin-top:8px}.contact{align-items:flex-start;flex-direction:column}footer{flex-direction:column}}
  </style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="#home">MW<span>.</span></a><nav class="links" id="navlinks"><a href="#about">About</a><a href="#experience">Experience</a><a href="#projects">Projects</a><a href="#contact">Contact</a></nav><button class="menu" id="menu" aria-label="메뉴 열기">☰</button></div></header>
<main class="wrap"><div id="content" class="loading">콘텐츠를 불러오는 중입니다…</div></main>
<footer class="wrap"><span>© <span id="year"></span> <span id="footer-name">Portfolio</span>. All rights reserved.</span><span>Hosted on GitHub Pages · Edit content.md to update this site</span></footer>
<script>
const $=(s,root=document)=>root.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nodesBySection(nodes){const out=[];let current=null;for(const n of nodes){if(n.tagName==='H2'){current={title:n.textContent.trim(),nodes:[]};out.push(current)}else if(current)current.nodes.push(n)}return out}
function sectionMarkup(title,items){
 const key=title.toLowerCase();
 const ids={about:'about',experience:'experience',projects:'projects',contact:'contact'};
 const id=ids[key]||key.replace(/[^a-z0-9]+/g,'-');
 const inner=items.map(n=>n.outerHTML).join('');
 if(key==='about'){
   const parts=items.filter(n=>n.tagName==='H3');
   const cards=parts.map(h=>{let content='';let n=h.nextElementSibling;while(n&&n.tagName!=='H3'&&n.tagName!=='H2'){content+=n.outerHTML;n=n.nextElementSibling}return '<article class="panel"><h3>'+h.innerHTML+'</h3>'+content+'</article>'}).join('');
   return '<section id="'+id+'"><div class="section-head"><div><div class="kicker">01 / ABOUT</div><h2>About</h2></div><p>Curiosity first, always.</p></div><div class="about-grid">'+(cards||'<article class="panel">'+inner+'</article>')+'</div></section>';
 }
 if(key==='experience'){
   let entries='',i=0;for(const n of items){if(n.tagName==='H3'){i++;const m=n.textContent.match(/^(.+?)\s*\|\s*(.+)$/);entries+='<article class="timeline-item"><div class="date">'+esc(m?m[1]:'')+'</div><div><h3>'+esc(m?m[2]:n.textContent)+'</h3>'}else if(n.tagName==='P'){entries+=n.outerHTML+'</div></article>'}}
   return '<section id="'+id+'"><div class="section-head"><div><div class="kicker">02 / JOURNEY</div><h2>Experience & Education</h2></div><p>Milestones along the way.</p></div><div class="timeline">'+entries+'</div></section>';
 }
 if(key==='projects'){
   let entries='',opened=false;
   for(const n of items){
     if(n.tagName==='H3'){if(opened)entries+='</article>';entries+='<article class="project"><h3>'+n.innerHTML+'</h3>';opened=true}
     else if(n.tagName==='P'&&/^Tech:/i.test(n.textContent.trim())){const raw=n.textContent.replace(/^Tech:\\s*/i,'');entries+='<div class="tags">'+raw.split(',').map(t=>'<span class="tag">'+esc(t.trim())+'</span>').join('')+'</div>'}
     else if(n.tagName==='P'&&opened)entries+='<p>'+n.innerHTML+'</p>';
     else if(n.tagName==='UL'&&opened){const tags=[...n.querySelectorAll('li')].map(x=>x.textContent);entries+='<div class="tags">'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>'}
   }
   if(opened)entries+='</article>';
   return '<section id="'+id+'"><div class="section-head"><div><div class="kicker">03 / SELECTED WORK</div><h2>Projects & Research</h2></div><p>Ideas, experiments, and things I have built.</p></div><div class="cards">'+entries+'</div></section>';
 }
 if(key==='contact'){
   const email=items.map(n=>n.textContent).join(' ').match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
   const copy=items.filter(n=>!n.textContent.startsWith('Email:')).map(n=>n.outerHTML).join('');
   return '<section id="'+id+'"><div class="contact"><div><div class="kicker" style="color:#aeb8ff">04 / CONTACT</div><h2>Let’s connect.</h2>'+copy+'</div><a class="btn" href="'+(email?'mailto:'+esc(email[0]):'#')+'">'+(email?esc(email[0]):'Contact me')+' ↗</a></div></section>';
 }
 return '<section id="'+id+'">'+inner+'</section>';
}
async function loadContent(){
 try{
  const response=await fetch('./content.md?v='+Date.now());if(!response.ok)throw new Error('content.md를 불러오지 못했습니다.');
  const markdown=await response.text();const parsed=new DOMParser().parseFromString(marked.parse(markdown),'text/html');const nodes=[...parsed.body.children];
  const h1=nodes.find(n=>n.tagName==='H1');const name=h1?h1.textContent.trim():'My Portfolio';
  const firstP=nodes.find(n=>n.tagName==='P');const lead=firstP?firstP.innerHTML:'Welcome to my portfolio.';
  const quote=nodes.find(n=>n.tagName==='BLOCKQUOTE');const role=quote?quote.textContent.replace(/^\s*|\s*$/g,''):'Personal Portfolio';
  const sections=nodesBySection(nodes);
  const main=$('#content');main.className='';
  main.innerHTML='<div class="hero" id="home"><div><div class="eyebrow">✦ Welcome to my space</div><h1>Hi, I’m <em>'+esc(name)+'</em>.</h1><p class="lead">'+lead+'</p><div class="actions"><a class="btn primary" href="#projects">Explore my work ↗</a><a class="btn secondary" href="#contact">Get in touch</a></div></div><aside class="profile"><div class="avatar">'+esc(name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())+'</div><h3>'+esc(name)+'</h3><p>'+esc(role)+'</p><div class="meta"><span>Profile <b>'+esc(name)+'</b></span><span>Website <b>Personal portfolio</b></span><span>Status <b>Open to collaboration</b></span></div></aside></div>'+sections.map(s=>sectionMarkup(s.title,s.nodes)).join('');
  document.title=name+' | Portfolio';$('#footer-name').textContent=name;
 }catch(e){$('#content').className='loading error';$('#content').textContent=e.message+' GitHub 저장소에 content.md 파일이 있는지 확인해 주세요.'}
}
$('#year').textContent=new Date().getFullYear();$('#menu').addEventListener('click',()=>$('#navlinks').classList.toggle('open'));document.querySelectorAll('#navlinks a').forEach(a=>a.addEventListener('click',()=>$('#navlinks').classList.remove('open')));loadContent();
</script>
</body></html>
