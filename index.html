    :root{--ink:#172033;--muted:#697386;--line:#e7eaf1;--paper:#fff;--bg:#f7f8fc;--blue:#4d65e8;--shadow:0 18px 55px rgba(27,39,75,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans KR",sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}.wrap{width:min(1100px,calc(100% - 44px));margin:auto}
    header{position:sticky;top:0;z-index:10;background:rgba(247,248,252,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(231,234,241,.8)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.7px;font-size:18px}.brand span{color:var(--blue)}.links{display:flex;gap:27px;color:#596276;font-size:13px;font-weight:700}.links a:hover,.links a.active{color:var(--blue)}.links a{padding:8px 0}.menu{display:none;border:0;background:none;font-size:23px}
    .hero{padding:86px 0 70px;display:grid;grid-template-columns:1.35fr .65fr;gap:55px;align-items:center}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,66px);letter-spacing:-3px;line-height:1.13;margin:20px 0}.hero h1 em{font-style:normal;color:var(--blue)}.lead{font-size:17px;color:var(--muted);max-width:610px}.actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}.btn{padding:12px 19px;border-radius:10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px #4d65e83a}.secondary{background:#fff;border:1px solid var(--line)}
    .profile{background:linear-gradient(145deg,#e8ebff,#f8f9ff);border:1px solid #e2e6ff;border-radius:26px;padding:28px;box-shadow:var(--shadow)}.avatar{width:92px;height:92px;border-radius:24px;background:linear-gradient(145deg,#6278f2,#9ba8ff);display:grid;place-items:center;color:white;font-size:31px;font-weight:800}.profile h3{font-size:20px;margin:18px 0 2px}.profile p{margin:0;color:var(--muted);font-size:13px}.profile .meta{margin-top:24px;padding-top:18px;border-top:1px solid #dfe3f5;display:grid;gap:10px;font-size:12px;color:#596276}
    section{padding:54px 0;scroll-margin-top:75px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.kicker{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:1.5px}.section-head h2{font-size:29px;letter-spacing:-1px;margin:4px 0 0}.section-head p{margin:0;color:var(--muted);font-size:13px}.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.timeline-item,.project{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 5px 20px #1c2a4a05}.panel h3{margin:0 0 10px;font-size:16px}.panel p,.panel li{color:var(--muted);font-size:14px}.panel p{margin:0}.panel ul{padding-left:20px;margin:12px 0 0}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.tag{background:#f1f3fa;color:#596276;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700}
    .timeline,.cards{display:grid;gap:13px}.timeline-item{display:grid;grid-template-columns:145px 1fr;gap:20px;padding:20px 23px}.date{color:var(--blue);font-size:12px;font-weight:800}.timeline-item h3,.project h3{font-size:15px;margin:0}.timeline-item p,.project p{font-size:13px;color:var(--muted);margin:5px 0 0}.cards{grid-template-columns:repeat(2,1fr);gap:17px}.project{padding:22px;transition:.2s}.project:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.project .tags{margin-top:14px}.contact{background:#18213a;color:#fff;border-radius:23px;padding:34px;display:flex;justify-content:space-between;align-items:center;gap:20px}.contact h2{font-size:25px;margin:0 0 5px}.contact p{color:#b8c0d3;margin:0;font-size:13px}.contact .btn{background:#fff;color:#18213a;white-space:nowrap}.notice{font-size:11px;color:#939aaa;margin-top:15px}footer{padding:30px 0 42px;color:#9299a8;font-size:11px;display:flex;justify-content:space-between;gap:15px}
    .markdown{padding:70px 0 90px;max-width:900px}.markdown h1{font-size:clamp(38px,6vw,62px);letter-spacing:-2px;line-height:1.2;margin:0 0 20px;color:var(--ink)}.markdown h2{font-size:28px;letter-spacing:-.8px;margin:116px 0 36px;padding-bottom:12px;border-bottom:1px solid var(--line)}.markdown h3{font-size:19px;margin:30px 0 10px}.project-entry-gap{display:block;height:23px;min-height:23px}#content h3.project-entry-title{margin-top:0!important}.markdown p,.markdown li{color:#596276;font-size:15px;line-height:1.9}.markdown blockquote{margin:24px 0;padding:14px 20px;border-left:3px solid var(--blue);background:#eef0ff;border-radius:0 10px 10px 0;color:#596276}.markdown ul{padding-left:23px}

    .bio-timeline:before{content:"";position:absolute;left:3px;top:7px;bottom:10px;width:1px;background:#d9e2ff}
    .bio-timeline-item{position:relative;padding:0 0 25px 0}

    .bio-timeline-item:before{content:"";position:absolute;left:-24px;top:6px;width:8px;height:8px;border-radius:50%;background:#8baaf7;border:2px solid #edf2ff;box-sizing:content-box}
    .bio-date{font-size:13px;color:#64799f;margin:0 0 7px}

    .bio-content p{margin:0;font-size:15px;line-height:1.8;color:#596276}
    .bio-content .scholarship-points{margin:12px 0 0;padding-left:20px;color:#596276}
    .bio-content .scholarship-points li{font-size:15px;line-height:1.8;padding-left:2px;margin:0 0 11px}
    .bio-content .scholarship-points li:last-child{margin-bottom:0}
    .bio-content .research-compact-points li{margin-bottom:5.5px}
    .research-timeline .bio-content p + p{margin-top:8px}
    .presentation-entry-gap{display:block;height:23px;min-height:23px}#content h3.presentation-entry-title{margin-top:0!important}
    @media(max-width:640px){.bio-timeline{margin-left:2px}.bio-content p{font-size:14px}}.markdown a{color:var(--blue);text-decoration:underline}.markdown strong{color:var(--ink)}.markdown hr{border:0;border-top:1px solid var(--line);margin:38px 0}.markdown code{background:#eef0f5;padding:2px 6px;border-radius:5px}.markdown img{display:block;max-width:min(100%,720px);height:auto;margin:22px auto;border-radius:18px;box-shadow:0 12px 35px rgba(27,39,75,.12)}.markdown .profile-photo img{width:min(260px,65vw);max-height:360px;aspect-ratio:4/5;object-fit:cover;margin:8px 0 26px;border-radius:22px}.markdown.loading{text-align:center;color:var(--muted);padding:100px 0}.markdown.error{color:#b42318}
    .loading{padding:100px 0;text-align:center;color:var(--muted)}.error{color:#b42318}
    @media(max-width:760px){.links{display:none;position:absolute;top:72px;left:0;right:0;background:#fff;padding:18px 24px;flex-direction:column;gap:13px;border-bottom:1px solid var(--line)}.links.open{display:flex}.menu{display:block}.hero{grid-template-columns:1fr;padding:58px 0 35px;gap:30px}.about-grid,.cards{grid-template-columns:1fr}.timeline-item{grid-template-columns:1fr;gap:4px}.section-head{display:block}.section-head p{margin-top:8px}.contact{align-items:flex-start;flex-direction:column}footer{flex-direction:column}}

    .page-content a{color:#2563eb;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
    .section-view{display:inline-block;margin-left:10px;font-size:12px;font-weight:600;letter-spacing:0;color:#3568d4;text-decoration:underline;text-underline-offset:3px;vertical-align:middle}
    .photo-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(15,23,42,.72)}
    .photo-modal.open{display:flex}.photo-modal-panel{position:relative;width:min(980px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .photo-modal-close{position:sticky;float:right;top:0;border:0;border-radius:50%;width:36px;height:36px;background:#f0f2f7;color:#26324a;font-size:23px;cursor:pointer;line-height:1}
    .photo-gallery{clear:both;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding-top:12px}
    .photo-gallery figure{margin:0}.photo-gallery img{display:block;width:100%;height:auto;max-height:65vh;object-fit:contain;border-radius:10px;background:#f3f4f6}
    .photo-gallery figcaption{padding-top:9px;font-size:13px;line-height:1.6;color:#596276}
    @media(max-width:640px){.photo-modal{padding:12px}.photo-modal-panel{padding:18px}.photo-gallery{grid-template-columns:1fr}}

    .page-content[hidden]{display:none}.page-content{min-height:65vh;padding-top:27px}.page-content>.markdown{padding-top:54px}.page-content h2{font-size:28px;letter-spacing:-.8px;margin:116px 0 36px;padding-bottom:12px;border-bottom:1px solid var(--line)}.page-content h2:first-of-type{margin-top:20px}.links a.active{position:relative}.links a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--blue);border-radius:2px}\n    .profile-intro{display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;align-items:flex-start !important;gap:22px;margin:9px 0 42px;padding:26px;border:1px solid var(--line);border-radius:24px;background:#fff;box-shadow:var(--shadow);width:100%}
    .profile-photo-column{display:flex !important;flex:0 0 220px !important;flex-direction:column;align-items:flex-start;width:220px;min-width:220px}
    .profile-intro .profile-photo{display:block !important;width:100%;margin:0}
    .profile-intro .profile-photo img{display:block;width:220px;max-width:100%;height:auto;max-height:none;aspect-ratio:auto;object-fit:contain;object-position:center;margin:0;border-radius:3px;box-shadow:none}
    .profile-summary{display:block !important;position:static !important;flex:1 1 0 !important;width:auto !important;min-width:0 !important;margin:0 !important}
    .profile-summary h2{margin:0 0 8px;font-size:1.55rem}
    .profile-summary p{margin:0 0 10px;color:var(--muted);line-height:2.7}
    .profile-links{display:flex;flex-direction:row;flex-wrap:wrap;gap:7px;align-items:center;margin-top:8px}
    .profile-links a{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;font-weight:500;color:#697386;background:#fff}
    .profile-links a:hover{background:#f1f3ff;border-color:#cbd2ff;color:#596276}
    .profile-links .email-icon{display:inline-flex;align-items:center;margin-right:6px;color:currentColor}
    .profile-links .email-icon svg{display:block}
    @media(max-width:760px){
      .profile-intro{gap:14px;padding:16px}
      .profile-photo-column{flex-basis:160px !important;width:160px;min-width:160px}
      .profile-intro .profile-photo img{width:160px}
      .profile-summary h2{font-size:1.2rem}
      .profile-summary p{font-size:.9rem}
      .profile-links{gap:6px}
      .profile-links a{font-size:.72rem;padding:5px 7px}
    }
    @media(max-width:420px){
      .profile-intro{gap:12px}
      .profile-photo-column{flex-basis:112px !important;width:112px;min-width:112px}
      .profile-intro .profile-photo img{width:112px}
    }
  </style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="#home" id="brand-home">MW<span>.</span></a><nav class="links" id="navlinks" aria-label="Main navigation"><a href="#home" data-page="home" class="active">Home</a><a href="#portfolio" data-page="portfolio">Research Portfolio</a><a href="#etc" data-page="etc">Etc</a></nav><button class="menu" id="menu" aria-label="메뉴 열기">☰</button></div></header>
<main class="wrap"><article id="content" class="markdown loading">내용을 불러오는 중입니다…</article></main>
<footer class="wrap"><span>© <span id="year"></span> <span id="footer-name">Portfolio</span></span><span>이 홈페이지의 내용은 content.md에서 수정할 수 있습니다.</span></footer>
<script>
const $=(s,root=document)=>root.querySelector(s);
const sectionPage={
  'About':'home','Education':'home','Scholarship':'home','Research Experience':'home', 'Academic Activities & Presentations':'home','Leadership':'home','Work Experience':'home',
  'Presentations':'portfolio','Projects':'portfolio',
  'Files':'etc','Contact':'etc'
};
function showPage(page,updateHash=true){
  document.querySelectorAll('.page-content').forEach(el=>el.hidden=el.dataset.page!==page);
  document.querySelectorAll('#navlinks a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  if(updateHash) history.replaceState(null,'','#'+page);
  $('#navlinks').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}
async function loadContent(){
 try{
  const response=await fetch('./content.md?v='+Date.now());
  if(!response.ok)throw new Error('content.md 파일을 불러오지 못했습니다.');
  const markdown=await response.text();
  const main=$('#content');
  main.innerHTML=marked.parse(markdown);
  main.classList.remove('loading');
  const photo=main.querySelector('.profile-photo');
  const heading=main.querySelector('h1');
  const summary=main.querySelector('.profile-summary');
  if(photo && summary){
    const params=new URLSearchParams(location.search);
    const links=[
      ['Email',params.get('email')||'mailto:wmw0602@korea.ac.kr'],
      ['GitHub',params.get('github')||'https://github.com/mwwang62'],
      ['Google Scholar',params.get('scholar')],
      ['LinkedIn',params.get('linkedin')||'https://www.linkedin.com/in/minwoo-wang-55a447451/'],
      ['CV',params.get('cv')]
    ].filter(([,url])=>url && url.trim());
    const intro=document.createElement('section');
    intro.className='profile-intro';
    // Move all introductory Markdown content after the profile block into the
    // summary, stopping before the first section heading (for example, About).
    let introNode=summary.nextSibling;
    while(introNode && !(introNode.nodeType===1 && /^H[1-6]$/.test(introNode.tagName))){
      const nextIntroNode=introNode.nextSibling;
      summary.appendChild(introNode);
      introNode=nextIntroNode;
    }
    const nav=document.createElement('nav');
    nav.className='profile-links';
    nav.setAttribute('aria-label','Profile links');
    links.forEach(([label,url])=>{
      const a=document.createElement('a');a.href=url;
      if(label==='Email' || label==='GitHub' || label==='LinkedIn'){
        const icon=document.createElement('span');icon.className='email-icon';icon.setAttribute('aria-hidden','true');
        if(label==='LinkedIn') icon.style.cssText='width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;border:1px solid currentColor;border-radius:2px;box-sizing:border-box;margin-right:6px';
        icon.innerHTML=label==='Email'
          ? '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="1.5" y="3" width="13" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="m2.5 4 5.5 4.5L13.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          : label==='GitHub'
            ? '<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M8 .8a7.2 7.2 0 0 0-2.28 14.03c.36.07.49-.16.49-.35v-1.25c-2 .44-2.42-.85-2.42-.85-.33-.83-.8-1.05-.8-1.05-.65-.45.05-.44.05-.44.72.05 1.1.74 1.1.74.64 1.1 1.68.78 2.09.6.06-.47.25-.78.46-.96-1.6-.18-3.28-.8-3.28-3.56 0-.79.28-1.43.74-1.94-.08-.18-.32-.92.07-1.91 0 0 .6-.19 1.98.74a6.9 6.9 0 0 1 3.6 0c1.38-.93 1.98-.74 1.98-.74.39.99.15 1.73.07 1.91.46.51.74 1.15.74 1.94 0 2.77-1.68 3.38-3.29 3.56.26.22.49.66.49 1.33v1.97c0 .19.13.42.5.35A7.2 7.2 0 0 0 8 .8Z"/></svg>'
            : '<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M2.2 5.8h2.4v7.7H2.2zM3.4 2.5a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8ZM6.1 5.8h2.3v1.05h.03c.32-.6 1.1-1.23 2.27-1.23 2.43 0 2.88 1.6 2.88 3.68v4.2h-2.4V9.78c0-.9-.02-2.05-1.25-2.05-1.25 0-1.44.98-1.44 1.99v3.78H6.1z"/></svg>';
        a.append(icon,document.createTextNode(label));
      }else{a.textContent=label;}
      if(!url.startsWith('mailto:')){a.target='_blank';a.rel='noopener noreferrer'}
      nav.appendChild(a);
    });
    const photoColumn=document.createElement('div');
    photoColumn.className='profile-photo-column';
    // Set layout on the elements themselves so broad theme/section rules cannot
    // collapse the profile into a vertical stack.
    intro.style.setProperty('display','grid','important');
    intro.style.setProperty('grid-template-columns','220px minmax(0,1fr)','important');
    intro.style.setProperty('grid-template-rows','auto auto','important');
    intro.style.setProperty('column-gap','90px','important');
    intro.style.setProperty('row-gap','12px','important');
    intro.style.setProperty('align-items','start','important');
    photoColumn.style.setProperty('grid-column','1','important');
    photoColumn.style.setProperty('grid-row','1 / span 2','important');
    photoColumn.style.setProperty('width','220px','important');
    photoColumn.style.setProperty('min-width','0','important');
    summary.style.setProperty('grid-column','2','important');
    summary.style.setProperty('grid-row','1','important');
    summary.style.setProperty('display','block','important');
    summary.style.setProperty('width','100%','important');
    summary.style.setProperty('min-width','0','important');
    nav.style.setProperty('display','flex','important');
    nav.style.setProperty('flex-direction','row','important');
    nav.style.setProperty('flex-wrap','nowrap','important');
    nav.style.setProperty('width','max-content','important');
    nav.style.setProperty('white-space','nowrap','important');
    nav.style.setProperty('gap','7px','important');
    nav.style.setProperty('margin-top','12px','important');
    photo.parentNode.insertBefore(intro,photo);
    intro.append(photoColumn,summary);
    photoColumn.append(photo);
    summary.appendChild(nav);
  }
  const title=main.querySelector('h1');
  const name=title?title.textContent.trim():'Portfolio';
  document.title='mwwang | Portfolio';
  $('#footer-name').textContent=name;
  const pages={home:document.createElement('section'),portfolio:document.createElement('section'),etc:document.createElement('section')};
  Object.entries(pages).forEach(([key,el])=>{el.className='page-content';el.dataset.page=key;el.hidden=key!=='home';});
  let current='home';
  [...main.childNodes].forEach(node=>{
    if(node.nodeType===1 && node.tagName==='H2'){
      const headingText=node.textContent.replace(/\s*View\s*$/,'').trim();
      current=sectionPage[headingText]||'etc';
    }
    pages[current].appendChild(node);
  });
  main.replaceWith(...Object.values(pages));
  const gallery=document.createElement('div');
  gallery.className='photo-modal';
  gallery.id='academic-photo-modal';
  gallery.setAttribute('role','dialog');
  gallery.setAttribute('aria-modal','true');
  gallery.setAttribute('aria-label','Academic activities photos');
  gallery.innerHTML='<div class="photo-modal-panel"><button class="photo-modal-close" type="button" aria-label="Close photo gallery">×</button><div class="photo-gallery"></div></div>';
  const galleryItems=[
    ['assets/photos/workshop-staff.jpeg','Conference staff at the International Workshop on Multi-probe Approach to Wavy Dark Matters · November 30–December 2, 2023'],
    ['assets/photos/kps-poster.jpeg','Poster presentation at the 2024 Korean Physical Society Fall Meeting · October 2024'],
    ['assets/photos/rcnp-visit.jpeg','Short-term Academic Visit to RCNP, Osaka University · July 2024']
  ];
  const galleryGrid=gallery.querySelector('.photo-gallery');
  galleryItems.forEach(([src,caption])=>{
    const figure=document.createElement('figure');
    const img=document.createElement('img');img.src=src;img.alt=caption;img.loading='lazy';
    const figcaption=document.createElement('figcaption');figcaption.textContent=caption;
    figure.append(img,figcaption);galleryGrid.appendChild(figure);
  });
  document.body.appendChild(gallery);
  const closeGallery=()=>gallery.classList.remove('open');
  gallery.querySelector('.photo-modal-close').addEventListener('click',closeGallery);
  gallery.addEventListener('click',event=>{if(event.target===gallery)closeGallery();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeGallery();});
  document.addEventListener('click',event=>{
    const trigger=event.target.closest('[data-gallery="academic"]');
    if(trigger){event.preventDefault();gallery.classList.add('open');}
  });
  const initial=location.hash.replace('#','');
  showPage(pages[initial]?initial:'home',false);
 }catch(error){
  const main=$('#content');main.classList.add('loading','error');
  main.textContent=error.message;
 }
}
$('#year').textContent=new Date().getFullYear();
$('#menu').addEventListener('click',()=>$('#navlinks').classList.toggle('open'));
$('#navlinks').addEventListener('click',event=>{
  const link=event.target.closest('a[data-page]');
  if(link){event.preventDefault();showPage(link.dataset.page);}
});
$('#brand-home').addEventListener('click',event=>{event.preventDefault();showPage('home');});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(['home','portfolio','etc'].includes(page))showPage(page,false);});
loadContent();
</script>
</body></html>
